name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/edge-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/edge-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test:unit

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rivocloud
          POSTGRES_USER: rivocloud
          POSTGRES_PASSWORD: rivocloud_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivocloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    env:
      DATABASE_URL: postgresql://rivocloud:rivocloud_dev_password@localhost:5432/rivocloud
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222
      INTERNAL_API_SECRET: ci_internal_secret_placeholder_value
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/edge-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rivocloud/db exec prisma migrate deploy
      - run: node apps/identity-service/scripts/generate-jwt-keys.cjs
      - run: pnpm turbo test:integration

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/edge-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      # Go dependencies were outside all vulnerability scanning: pnpm audit
      # cannot see apps/edge-proxy's go.mod. Pinned to v1.1.4 rather than
      # @latest because golang.org/x/vuln now requires Go >= 1.25 while this
      # repo pins 1.23.
      #
      # continue-on-error matches the pnpm audit step above, and is required
      # today: all 27 findings it reports are in the Go 1.23 standard library
      # (fixed in go1.25.x), not in apps/edge-proxy's own dependencies, which
      # are clean. Bumping the pinned Go toolchain would let this become a
      # hard gate.
      - name: govulncheck (Go modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: apps/edge-proxy
        continue-on-error: true
