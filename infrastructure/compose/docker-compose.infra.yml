services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rivocloud
      POSTGRES_USER: rivocloud
      POSTGRES_PASSWORD: rivocloud_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivocloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rivocloud]

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rivocloud]

  traefik:
    image: traefik:v3.1
    command:
      - "--providers.redis.endpoints=redis:6379"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@rivocloud.dev}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--api.insecure=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - traefik_certs:/letsencrypt
    depends_on:
      redis:
        condition: service_healthy
    networks: [rivocloud]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rivocloud
      MINIO_ROOT_PASSWORD: rivocloud_dev_password
      MINIO_NOTIFY_WEBHOOK_ENABLE_STORAGE: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_STORAGE: "http://host.docker.internal:3004/internal/storage/minio-webhook"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_STORAGE: "dev_minio_webhook_token_change_me"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rivocloud]

  clickhouse:
    image: clickhouse/clickhouse-server:23
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [rivocloud]

  nats:
    image: nats:2-alpine
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    networks: [rivocloud]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [rivocloud]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3002:3000"
    networks: [rivocloud]

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks: [rivocloud]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
  traefik_certs:

networks:
  rivocloud:
    driver: bridge
